let userAnswers = {};
let isRetryMode = false;
let currentRetryIds = [];

function renderQuiz() {
    const container = document.getElementById('quizContainer');
    const topicFilter = document.getElementById('topicFilter').value;
    container.innerHTML = '';

    let filteredQuestions = quizData.filter(q => {
        if (isRetryMode) {
            return currentRetryIds.includes(q.id);
        }
        if (topicFilter !== 'ALL' && q.section !== topicFilter) {
            return false;
        }
        return true;
    });

    if (filteredQuestions.length === 0) {
        container.innerHTML = `
            <div class="no-questions">
                <h3>No questions found!</h3>
                <p>${isRetryMode ? 'Great job! You have no wrong questions in this view.' : 'Try selecting another topic filter.'}</p>
            </div>
        `;
        return;
    }

    filteredQuestions.forEach((q) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `q-card-${q.id}`;

        const answered = userAnswers[q.id] !== undefined;
        const isCorrect = userAnswers[q.id] === q.answer;

        if (answered) {
            card.classList.add(isCorrect ? 'correct-attempt' : 'wrong-attempt');
        }

        let optionsHTML = '';
        q.options.forEach((opt, optIdx) => {
            let btnClass = 'option-btn';
            if (answered) {
                if (userAnswers[q.id] === optIdx) {
                    btnClass += optIdx === q.answer ? ' selected-correct' : ' selected-incorrect';
                } else if (optIdx === q.answer) {
                    btnClass += ' reveal-correct';
                }
            }

            optionsHTML += `
                <button class="${btnClass}" 
                        onclick="selectOption(${q.id}, ${optIdx})" 
                        ${answered ? 'disabled' : ''}>
                    <span>${opt}</span>
                </button>
            `;
        });

        card.innerHTML = `
            <div class="question-header">
                <span>Question ${q.id} of ${quizData.length}</span>
                <span class="question-tag">Section ${q.section}</span>
            </div>
            <div class="question-text">${q.question}</div>
            <div class="options">${optionsHTML}</div>
            <div class="explanation" id="exp-${q.id}" style="display: ${answered ? 'block' : 'none'}">
                <div class="explanation-title">Explanation:</div>
                <div>${q.explanation}</div>
            </div>
        `;

        container.appendChild(card);
    });

    updateScoreBoard();
}

function selectOption(qId, optIndex) {
    userAnswers[qId] = optIndex;
    renderQuiz();
}

function getWrongQuestionIds() {
    return Object.keys(userAnswers)
        .map(id => parseInt(id))
        .filter(id => {
            const q = quizData.find(item => item.id === id);
            return q && userAnswers[id] !== q.answer;
        });
}

function updateScoreBoard() {
    const attemptedIds = Object.keys(userAnswers);
    let correctCount = 0;
    let wrongCount = 0;

    attemptedIds.forEach(id => {
        const q = quizData.find(item => item.id == id);
        if (q) {
            if (userAnswers[id] === q.answer) {
                correctCount++;
            } else {
                wrongCount++;
            }
        }
    });

    const scoreEl = document.getElementById('score');
    const attemptedEl = document.getElementById('attempted');
    const wrongCountEl = document.getElementById('wrongCount');
    const wrongBadgeEl = document.getElementById('wrongBadge');
    const retryBtn = document.getElementById('retryBtn');

    if (scoreEl) scoreEl.innerText = correctCount;
    if (attemptedEl) attemptedEl.innerText = attemptedIds.length;
    if (wrongCountEl) wrongCountEl.innerText = wrongCount;
    if (wrongBadgeEl) wrongBadgeEl.innerText = wrongCount;

    if (retryBtn) {
        if (wrongCount > 0 && !isRetryMode) {
            retryBtn.style.display = 'inline-block';
            retryBtn.innerText = `Retry Incorrect Questions (${wrongCount})`;
            retryBtn.style.background = "var(--accent)";
        } else if (isRetryMode) {
            retryBtn.style.display = 'inline-block';
            retryBtn.innerText = "Show All Questions";
            retryBtn.style.background = "var(--primary)";
        } else {
            retryBtn.style.display = 'none';
        }
    }
}

function toggleRetryMode() {
    isRetryMode = !isRetryMode;

    if (isRetryMode) {
        // Collect wrong question IDs before resetting user answers for those questions
        currentRetryIds = getWrongQuestionIds();
        
        // Clear stored answers for wrong questions so user can re-try
        currentRetryIds.forEach(id => {
            delete userAnswers[id];
        });
    } else {
        currentRetryIds = [];
    }

    renderQuiz();
}

function filterQuestions() {
    renderQuiz();
}

function resetQuiz() {
    userAnswers = {};
    isRetryMode = false;
    currentRetryIds = [];
    const retryBtn = document.getElementById('retryBtn');
    if (retryBtn) {
        retryBtn.innerText = `Retry Incorrect Questions (0)`;
        retryBtn.style.background = "var(--accent)";
        retryBtn.style.display = 'none';
    }
    renderQuiz();
}

// Initial render
renderQuiz();
